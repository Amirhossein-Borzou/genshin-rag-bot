<svg viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
          </marker>
          <marker id="arrowhead-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee" />
          </marker>
          <marker id="arrowhead-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24" />
          </marker>
          <marker id="arrowhead-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#fb923c" />
          </marker>
          <marker id="arrowhead-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
          </pattern>
        </defs>

        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- ================= ARROWS (behind boxes) ================= -->
        <!-- User -> Telegram Gateway -->
        <line x1="140" y1="190" x2="238" y2="190" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowhead-cyan)"/>
        <text x="189" y="181" fill="#94a3b8" font-size="9" text-anchor="middle">Telegram</text>

        <!-- Gateway -> Retrieval pipeline -->
        <line x1="390" y1="160" x2="438" y2="160" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="414" y="150" fill="#94a3b8" font-size="7" text-anchor="middle">query</text>

        <!-- Retrieval -> LLM -->
        <line x1="610" y1="160" x2="668" y2="160" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="639" y="150" fill="#94a3b8" font-size="7" text-anchor="middle">context</text>

        <!-- LLM -> answer: routed back to the gateway (reply path) -->
        <path d="M 750 210 L 750 340 L 315 340 L 315 215" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="530" y="332" fill="#94a3b8" font-size="8" text-anchor="middle">answer + sources footer</text>

        <!-- KB build flow: sources -> ingest -> chunker -> KB -->
        <line x1="140" y1="480" x2="238" y2="480" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowhead-amber)"/>
        <line x1="390" y1="480" x2="438" y2="480" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowhead-amber)"/>
        <line x1="560" y1="480" x2="640" y2="480" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowhead-amber)"/>
        <text x="189" y="470" fill="#94a3b8" font-size="7" text-anchor="middle">scrape</text>
        <text x="300" y="470" fill="#94a3b8" font-size="7" text-anchor="middle">raw JSON/HTML</text>
        <text x="600" y="470" fill="#94a3b8" font-size="7" text-anchor="middle">chunk + provenance</text>

        <!-- KB -> Retrieval (context feeds retrieval) -->
        <path d="M 700 440 L 700 380 L 524 380 L 524 218" fill="none" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowhead-violet)"/>
        <text x="600" y="372" fill="#94a3b8" font-size="8" text-anchor="middle">context (top-k, fused)</text>

        <!-- FTS5 <-> vec index link -->
        <line x1="762" y1="480" x2="788" y2="480" stroke="#a78bfa" stroke-width="1.5"/>

        <!-- ================= VPS BOUNDARY ================= -->
        <rect x="200" y="40" width="770" height="650" rx="12" fill="rgba(251, 191, 36, 0.05)" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,4"/>
        <text x="212" y="58" fill="#fbbf24" font-size="10" font-weight="600">Linux VPS — systemd (genshin-bot) · secrets in bot.env (0600, gitignored)</text>

        <!-- ================= EXTERNAL ================= -->
        <rect x="30" y="60" width="130" height="60" rx="6" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="95" y="85" fill="white" font-size="11" font-weight="600" text-anchor="middle">LLM Provider</text>
        <text x="95" y="101" fill="#94a3b8" font-size="9" text-anchor="middle">GLM · reasoning ON</text>

        <rect x="30" y="160" width="110" height="60" rx="6" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="85" y="185" fill="white" font-size="11" font-weight="600" text-anchor="middle">User</text>
        <text x="85" y="201" fill="#94a3b8" font-size="9" text-anchor="middle">Telegram DM</text>

        <!-- LLM Provider -> LLM box -->
        <path d="M 160 90 L 670 90 L 670 106" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="416" y="82" fill="#94a3b8" font-size="8" text-anchor="middle">inference API (OpenAI-compatible)</text>

        <!-- ================= PIPELINE ================= -->
        <!-- Telegram Gateway -->
        <rect x="240" y="110" width="150" height="100" rx="6" fill="#0f172a"/>
        <rect x="240" y="110" width="150" height="100" rx="6" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
        <text x="315" y="138" fill="white" font-size="11" font-weight="600" text-anchor="middle">Telegram Gateway</text>
        <text x="315" y="158" fill="#94a3b8" font-size="9" text-anchor="middle">polling (no open ports)</text>
        <text x="315" y="174" fill="#94a3b8" font-size="9" text-anchor="middle">rate limit 15 q/h/user</text>
        <text x="315" y="190" fill="#94a3b8" font-size="9" text-anchor="middle">query log (hashed user)</text>

        <!-- Retrieval Pipeline -->
        <rect x="440" y="110" width="170" height="100" rx="6" fill="#0f172a"/>
        <rect x="440" y="110" width="170" height="100" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
        <text x="525" y="132" fill="white" font-size="11" font-weight="600" text-anchor="middle">Retrieval Pipeline</text>
        <text x="525" y="150" fill="#94a3b8" font-size="8" text-anchor="middle">fa glossary · stemming</text>
        <text x="525" y="164" fill="#94a3b8" font-size="8" text-anchor="middle">entity-anchored + kit fill</text>
        <text x="525" y="178" fill="#94a3b8" font-size="8" text-anchor="middle">intent boost · 2nd-hop budget</text>
        <text x="525" y="196" fill="#94a3b8" font-size="8" text-anchor="middle">answerability classifier</text>

        <!-- LLM -->
        <rect x="670" y="110" width="160" height="100" rx="6" fill="#0f172a"/>
        <rect x="670" y="110" width="160" height="100" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
        <text x="750" y="136" fill="white" font-size="11" font-weight="600" text-anchor="middle">LLM (strictly grounded)</text>
        <text x="750" y="156" fill="#94a3b8" font-size="9" text-anchor="middle">SYSTEM: answer from context</text>
        <text x="750" y="172" fill="#94a3b8" font-size="9" text-anchor="middle">label inference · flag beta</text>
        <text x="750" y="192" fill="#94a3b8" font-size="9" text-anchor="middle">[source: …] tags sanitized</text>

        <!-- ================= KB BUILD FLOW ================= -->
        <rect x="30" y="450" width="110" height="70" rx="6" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="85" y="478" fill="white" font-size="10" font-weight="600" text-anchor="middle">Sources</text>
        <text x="85" y="494" fill="#94a3b8" font-size="8" text-anchor="middle">nanoka · Game8 · KQM</text>
        <text x="85" y="508" fill="#94a3b8" font-size="8" text-anchor="middle">curated knowledge</text>

        <rect x="240" y="450" width="150" height="70" rx="6" fill="#0f172a"/>
        <rect x="240" y="450" width="150" height="70" rx="6" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
        <text x="315" y="478" fill="white" font-size="10" font-weight="600" text-anchor="middle">Ingestion</text>
        <text x="315" y="494" fill="#94a3b8" font-size="8" text-anchor="middle">incremental scrapers</text>
        <text x="315" y="508" fill="#94a3b8" font-size="8" text-anchor="middle">152 kits · 289 weapons</text>

        <rect x="440" y="450" width="120" height="70" rx="6" fill="#0f172a"/>
        <rect x="440" y="450" width="120" height="70" rx="6" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
        <text x="500" y="478" fill="white" font-size="10" font-weight="600" text-anchor="middle">Chunker</text>
        <text x="500" y="494" fill="#94a3b8" font-size="8" text-anchor="middle">semantic-unit chunks</text>
        <text x="500" y="508" fill="#94a3b8" font-size="8" text-anchor="middle">6,122 · quality checks</text>

        <!-- Knowledge base -->
        <rect x="640" y="450" width="120" height="70" rx="6" fill="#0f172a"/>
        <rect x="640" y="450" width="120" height="70" rx="6" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
        <text x="700" y="478" fill="white" font-size="10" font-weight="600" text-anchor="middle">SQLite FTS5</text>
        <text x="700" y="494" fill="#94a3b8" font-size="8" text-anchor="middle">kb.sqlite + chunk_meta</text>
        <text x="700" y="508" fill="#94a3b8" font-size="8" text-anchor="middle">provenance 100%</text>

        <!-- Vector index -->
        <rect x="790" y="450" width="130" height="70" rx="6" fill="#0f172a"/>
        <rect x="790" y="450" width="130" height="70" rx="6" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
        <text x="855" y="478" fill="white" font-size="10" font-weight="600" text-anchor="middle">sqlite-vec 384d</text>
        <text x="855" y="494" fill="#94a3b8" font-size="8" text-anchor="middle">bge-small (local)</text>
        <text x="855" y="508" fill="#94a3b8" font-size="8" text-anchor="middle">RRF k=60 · flag-gated</text>

        <!-- ================= EVAL ================= -->
        <rect x="240" y="570" width="290" height="90" rx="8" fill="#0f172a"/>
        <rect x="240" y="570" width="290" height="90" rx="8" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1.5"/>
        <text x="385" y="596" fill="white" font-size="11" font-weight="600" text-anchor="middle">Evaluation (deterministic + LLM judge)</text>
        <text x="385" y="616" fill="#94a3b8" font-size="8" text-anchor="middle">benchmark_v2: 40 cases · expected_chunk_ids</text>
        <text x="385" y="632" fill="#94a3b8" font-size="8" text-anchor="middle">Recall@K · MRR · Evidence Coverage (no LLM)</text>
        <text x="385" y="648" fill="#94a3b8" font-size="8" text-anchor="middle">judge: faithfulness 4.9/5 · zero hallucination</text>

        <!-- ================= SECURITY ================= -->
        <rect x="560" y="570" width="220" height="90" rx="8" fill="transparent" stroke="#fb7185" stroke-width="1" stroke-dasharray="4,4"/>
        <text x="568" y="584" fill="#fb7185" font-size="8">.env : secret scope</text>
        <rect x="575" y="596" width="190" height="52" rx="6" fill="#0f172a"/>
        <rect x="575" y="596" width="190" height="52" rx="6" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1.5"/>
        <text x="670" y="617" fill="white" font-size="11" font-weight="600" text-anchor="middle">bot.env : 0600</text>
        <text x="670" y="635" fill="#94a3b8" font-size="9" text-anchor="middle">never committed · hashed log users</text>

        <!-- ================= LEGEND ================= -->
        <text x="30" y="240" fill="white" font-size="10" font-weight="600">Legend</text>
        <rect x="30" y="252" width="16" height="10" rx="2" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1"/>
        <text x="52" y="260" fill="#94a3b8" font-size="8">Interface</text>
        <rect x="30" y="272" width="16" height="10" rx="2" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1"/>
        <text x="52" y="280" fill="#94a3b8" font-size="8">Runtime pipeline</text>
        <rect x="30" y="292" width="16" height="10" rx="2" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1"/>
        <text x="52" y="300" fill="#94a3b8" font-size="8">Ingestion</text>
        <rect x="30" y="312" width="16" height="10" rx="2" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1"/>
        <text x="52" y="320" fill="#94a3b8" font-size="8">Knowledge store</text>
        <rect x="30" y="332" width="16" height="10" rx="2" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1"/>
        <text x="52" y="340" fill="#94a3b8" font-size="8">Eval / Security</text>
        <line x1="30" y1="356" x2="46" y2="356" stroke="#fb923c" stroke-width="1" stroke-dasharray="3,3"/>
        <text x="52" y="359" fill="#94a3b8" font-size="8">Build flow</text>
      </svg>